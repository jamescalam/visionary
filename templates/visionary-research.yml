name: Visionary research

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      name:
        description: Experiment slug or issue number (optional)
        type: string
        default: ""

jobs:
  experiment:
    uses: jamescalam/visionary/.github/workflows/experiment.yml@main
    with:
      name: ${{ inputs.name }}
      environment: live
      setup: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --extra dev
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
