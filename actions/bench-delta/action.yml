name: Visionary bench delta
description: Run the repo's benchmark on the PR head and its merge base, publish whatever the run produced, and post one comment on the PR with the table and a download link.
inputs:
  token:
    description: GitHub token with pull-requests write
    required: true
  pr_number:
    description: Pull request number
    required: true
  base_sha:
    description: Merge base commit to compare against
    required: true
  command:
    description: Benchmark command (writes the results file)
    required: false
    default: make bench
  results:
    description: Path of the results JSON the command writes
    required: false
    default: benchmarks/results.json
  publish:
    description: Newline- or space-separated paths to publish as a downloadable artifact, in addition to the results file. Missing paths are skipped.
    required: false
    default: ""
  history:
    description: Path of a run-history file the command appends to. Restored before the run and saved after, so a trend across pull requests survives the runner being thrown away.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Restore benchmark history
      if: inputs.history != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.history }}
        key: visionary-bench-history-${{ github.repository }}-${{ github.run_id }}
        restore-keys: visionary-bench-history-${{ github.repository }}-
    - name: Bench head
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        RESULTS: ${{ inputs.results }}
      run: |
        set -euo pipefail
        bash -c "$CMD"
        mkdir -p "$RUNNER_TEMP/bench"
        cp "$RESULTS" "$RUNNER_TEMP/bench/head.json"
    - name: Collect what the run produced
      id: collect
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        PUBLISH: ${{ inputs.publish }}
        HISTORY: ${{ inputs.history }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/bench-publish"
        mkdir -p "$dir"
        cp "$RESULTS" "$dir/" 2>/dev/null || true
        for p in $PUBLISH $HISTORY; do
          [ -f "$p" ] && cp "$p" "$dir/" && echo "publishing $p"
        done
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        if [ -n "$HISTORY" ] && [ -f "$HISTORY" ]; then
          echo "history=true" >> "$GITHUB_OUTPUT"
        else
          echo "history=false" >> "$GITHUB_OUTPUT"
        fi
        ls -la "$dir"
    - name: Publish them
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-pr${{ inputs.pr_number }}-${{ github.run_id }}
        path: ${{ steps.collect.outputs.dir }}
        if-no-files-found: warn
        retention-days: 30
    - name: Save benchmark history
      if: steps.collect.outputs.history == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.history }}
        key: visionary-bench-history-${{ github.repository }}-${{ github.run_id }}
    - name: Bench base
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        RESULTS: ${{ inputs.results }}
        BASE: ${{ inputs.base_sha }}
      run: |
        set -euo pipefail
        git worktree add "$RUNNER_TEMP/base" "$BASE"
        cd "$RUNNER_TEMP/base"
        if bash -c "$CMD"; then
          cp "$RESULTS" "$RUNNER_TEMP/bench/base.json"
        else
          echo "base bench failed or has no benchmark; reporting head only"
        fi
    - name: Link the artifact from the pull request body
      if: steps.upload.outputs.artifact-url != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR: ${{ inputs.pr_number }}
        URL: ${{ steps.upload.outputs.artifact-url }}
        SHA: ${{ github.event.pull_request.head.sha }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        {
          echo "**Benchmark output** · [download]($URL) · from [this run]($RUN) on \`${SHA:0:7}\`"
          echo
          echo "Rebuilt on every push, so the link always points at the latest run."
        } > "$RUNNER_TEMP/bench/artifacts.md"
        python3 "${{ github.action_path }}/../../scripts/upsert_body_block.py" \
          "$PR" "<!-- visionary:artifacts -->" "$RUNNER_TEMP/bench/artifacts.md"
    - name: Diff and comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/../../scripts/bench_delta.py" \
          "$RUNNER_TEMP/bench/head.json" "$RUNNER_TEMP/bench/base.json" > "$RUNNER_TEMP/bench/comment.md"
        cat "$RUNNER_TEMP/bench/comment.md" >> "$GITHUB_STEP_SUMMARY"
        python3 "${{ github.action_path }}/../../scripts/upsert_comment.py" \
          "$PR" "<!-- visionary:bench -->" "$RUNNER_TEMP/bench/comment.md"
