# visionary's own config, so the reviewer can check this repo.
version: 1

checks:
  validate: python3 scripts/validate_plugin.py
  syntax: python3 -m py_compile scripts/*.py
  lint: ./actionlint -ignore SC2016

review:
  max_open_agent_prs: 2

plan:
  max_proposals: 3

labels:
  visionary: visionary
  proposal: proposal
  approved: approved
  in_progress: in-progress
  reconsider: reconsider
  fix_ok: agent-fix-ok
  experiment: experiment
  report: experiment-report
