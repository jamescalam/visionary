name: Visionary (self)

# visionary reviews its own pull requests with the version of itself under
# review, so the framework is its own first adopter.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: visionary-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      visionary_ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
