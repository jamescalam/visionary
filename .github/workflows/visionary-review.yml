name: Visionary (self)

# visionary reviews its own pull requests with the version of itself under
# review, so the framework is its own first adopter.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Human pushes supersede an in-flight review. A push by the bot (the reviewer
# committing fixes) gets its own group so it never cancels the run that made it.
concurrency:
  group: visionary-review-${{ github.event.pull_request.number }}-${{ (github.actor == 'claude[bot]' || github.actor == 'github-actions[bot]') && github.run_id || 'human' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      visionary_ref: ${{ github.event.pull_request.head.sha }}
      setup: |
        bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 . >/dev/null
        ./actionlint -version
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
