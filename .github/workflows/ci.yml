name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin, manifests, and secret hygiene
        run: python3 scripts/validate_plugin.py
      - name: Lint workflows and actions
        uses: raven-actions/actionlint@v2
        with:
          flags: -ignore 'SC2016'
      - name: Script syntax
        run: python3 -m py_compile scripts/*.py
