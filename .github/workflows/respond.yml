name: Visionary respond

# Reusable workflow. Runs the responder on a human comment or review, then
# the verifier when the responder pushed commits. The caller decides which
# comments qualify (see templates/visionary-respond.yml): every human comment
# on an agent-authored PR or issue, or any comment mentioning //vision.

on:
  workflow_call:
    inputs:
      kind:
        description: pr or issue
        type: string
        required: true
      number:
        description: PR or issue number
        type: number
        required: true
      trigger_id:
        description: id of the triggering comment or review
        type: string
        required: true
      trigger_kind:
        description: comment (conversation), inline (one diff comment), or review (a submitted review)
        type: string
        default: comment
      phrase:
        description: Text that addresses a comment to this role when the thread is not already an agent's
        type: string
        default: //vision
      bot_login:
        description: Login of the agent identity; every human comment on something it opened is for this role
        type: string
        default: claude[bot]
      head_ref:
        description: PR head branch (empty for issues)
        type: string
        default: ""
      visionary_ref:
        type: string
        default: main
      setup:
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5
      effort:
        type: string
        default: high
      verifier_effort:
        type: string
        default: xhigh
      max_turns:
        type: number
        default: 160
    secrets:
      claude_code_oauth_token:
        required: true

env:
  RESPOND_TOOLS: "Read,Glob,Grep,Edit,Write,Bash(gh:*),Bash(git:*),Bash(make:*),Bash(uv:*),Bash(cat:*),Bash(ls:*),Bash(python3:*),Bash(mkdir:*)"
  RESPOND_DENY: "Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git reset --hard:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh issue close:*),Bash(gh issue edit * --add-label approved*),Bash(gh issue edit * --remove-label approved*)"
  VERIFY_TOOLS: "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(make:*),Bash(uv:*),Bash(cat:*),Bash(ls:*)"
  RESPOND_SCHEMA: '{"type":"object","properties":{"action":{"type":"string","enum":["changed","replied","reacted","declined"]},"pushed":{"type":"boolean"},"summary":{"type":"string"}},"required":["action","pushed","summary"]}'
  VERIFY_SCHEMA: '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

jobs:
  # Whether a review is for this role cannot be decided in a workflow `if`.
  # A single inline comment on the diff arrives as a submitted review whose
  # body is empty and whose text lives in its inline comments, which an
  # expression cannot read. So the caller triggers broadly and this job makes
  # the decision with one API call.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          ID: ${{ inputs.trigger_id }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          PHRASE: ${{ inputs.phrase }}
          BOT: ${{ inputs.bot_login }}
        run: |
          set -uo pipefail
          case "$TRIGGER_KIND" in
            review) text=$(gh api "repos/$REPO/pulls/$NUMBER/reviews/$ID" --jq '.body // ""';
                          gh api "repos/$REPO/pulls/$NUMBER/reviews/$ID/comments" --jq '.[].body' 2>/dev/null) ;;
            inline) text=$(gh api "repos/$REPO/pulls/comments/$ID" --jq '.body // ""') ;;
            *)      text=$(gh api "repos/$REPO/issues/comments/$ID" --jq '.body // ""') ;;
          esac
          if [ "$KIND" = pr ]; then
            author=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.user.login')
          else
            author=$(gh api "repos/$REPO/issues/$NUMBER" --jq '.user.login')
          fi
          run=false
          if [ "$author" = "$BOT" ]; then
            run=true; echo "the $KIND was opened by $BOT, so every human comment on it is for this role"
          elif grep -qF -- "$PHRASE" <<<"$text"; then
            run=true; echo "the comment contains $PHRASE"
          else
            echo "not addressed to this role; nothing to do"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  respond:
    name: respond
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    concurrency:
      group: visionary-respond-${{ inputs.kind }}-${{ inputs.number }}
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.agent.outputs.pushed }}
      head_before: ${{ steps.agent.outputs.head_before }}
      head_after: ${{ steps.agent.outputs.head_after }}
    steps:
      # Acknowledge before doing anything, so the person who commented sees
      # within seconds that the comment was picked up. A comment takes a
      # reaction; a review does not, so that falls back to its first inline
      # comment and is skipped if it has none.
      # Acknowledge before doing anything, so the person who commented sees
      # within seconds that it was picked up. GitHub has no reactions endpoint
      # for a review, only for comments, so a review is acknowledged on each of
      # its inline comments, and a review with only a body falls back to the
      # pull request itself — otherwise the wait is indistinguishable from
      # being ignored, since a review-triggered run shows in no checks list.
      - name: Acknowledge the trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ inputs.trigger_id }}
          KIND: ${{ inputs.trigger_kind }}
          NUMBER: ${{ inputs.number }}
        run: |
          react() { gh api -X POST "$1/reactions" -f content=eyes --silent 2>/dev/null; }
          case "$KIND" in
            comment)
              react "repos/$REPO/issues/comments/$ID" && echo "reacted to conversation comment $ID"
              ;;
            inline)
              react "repos/$REPO/pulls/comments/$ID" && echo "reacted to inline comment $ID"
              ;;
            review)
              n=0
              for cid in $(gh api "repos/$REPO/pulls/$NUMBER/comments" --paginate \
                    --jq "[.[] | select(.pull_request_review_id == $ID)][].id" 2>/dev/null); do
                react "repos/$REPO/pulls/comments/$cid" && n=$((n+1))
              done
              if [ "$n" -gt 0 ]; then
                echo "reacted to $n inline comment(s) of review $ID"
              elif react "repos/$REPO/issues/$NUMBER"; then
                echo "review $ID has only a body, which takes no reaction; reacted to the pull request"
              else
                echo "nothing could be reacted to; the reply will be the only signal"
              fi
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref != '' && inputs.head_ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check out visionary
        uses: actions/checkout@v4
        with:
          repository: jamescalam/visionary
          ref: ${{ inputs.visionary_ref }}
          path: .visionary
      - name: Project setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - name: Respond
        id: agent
        uses: ./.visionary/actions/run-agent
        with:
          skill: respond
          args: ${{ github.repository }} ${{ inputs.kind }} ${{ inputs.number }} ${{ inputs.trigger_id }} ${{ inputs.trigger_kind }}
          oauth_token: ${{ secrets.claude_code_oauth_token }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          max_turns: ${{ inputs.max_turns }}
          pr_number: ${{ inputs.kind == 'pr' && inputs.number || '' }}
          notify_number: ${{ inputs.number }}
          allowed_tools: ${{ env.RESPOND_TOOLS }}
          disallowed_tools: ${{ env.RESPOND_DENY }}
          json_schema: ${{ env.RESPOND_SCHEMA }}

  verify:
    name: verify
    needs: [gate, respond]
    if: inputs.kind == 'pr' && needs.respond.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
      - name: Check out visionary
        uses: actions/checkout@v4
        with:
          repository: jamescalam/visionary
          ref: ${{ inputs.visionary_ref }}
          path: .visionary
      - name: Project setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - name: Verify
        uses: ./.visionary/actions/run-agent
        with:
          skill: verify
          args: ${{ github.repository }} ${{ inputs.number }} ${{ needs.respond.outputs.head_before }} ${{ needs.respond.outputs.head_after }}
          oauth_token: ${{ secrets.claude_code_oauth_token }}
          notify_number: ${{ inputs.number }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.verifier_effort }}
          max_turns: ${{ inputs.max_turns }}
          allowed_tools: ${{ env.VERIFY_TOOLS }}
          disallowed_tools: "Edit,Write,Bash(git push:*),Bash(git commit:*)"
          json_schema: ${{ env.VERIFY_SCHEMA }}
