name: Visionary review

# Reusable workflow. Runs the reviewer on a pull request, then a cold-read
# verifier when the reviewer pushed commits, then one more review round when
# the verifier requests changes. Call it from a workflow triggered by
# pull_request events; see templates/visionary-review.yml.

on:
  workflow_call:
    inputs:
      visionary_ref:
        description: Git ref of jamescalam/visionary to run (tag, branch, or sha)
        type: string
        default: main
      setup:
        description: Shell run before the agent to prepare the toolchain (install uv, sync deps)
        type: string
        default: ""
      model:
        type: string
        default: claude-opus-5
      effort:
        type: string
        default: high
      verifier_effort:
        type: string
        default: xhigh
      max_turns:
        type: number
        default: 80
      fix_label:
        description: PRs carrying this label let the reviewer push fixes
        type: string
        default: agent-fix-ok
      bot_login:
        description: PRs by this author always get fixes and a verification pass
        type: string
        default: "claude[bot]"
    secrets:
      claude_code_oauth_token:
        required: true

env:
  REVIEW_TOOLS_COMMENT: "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(make:*),Bash(uv:*),Bash(cat:*),Bash(ls:*),Bash(python3:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details"
  REVIEW_TOOLS_FIX: "Read,Glob,Grep,Edit,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(gh issue view:*),Bash(git:*),Bash(make:*),Bash(uv:*),Bash(cat:*),Bash(ls:*),Bash(python3:*),mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details"
  VERIFY_TOOLS: "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(make:*),Bash(uv:*),Bash(cat:*),Bash(ls:*)"
  REVIEW_SCHEMA: '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested","comment"]},"pushed":{"type":"boolean"},"summary":{"type":"string"},"findings":{"type":"integer"}},"required":["verdict","pushed","summary","findings"]}'
  VERIFY_SCHEMA: '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","changes_requested"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

jobs:
  # A push by the reviewer itself must not start another review, or the loop
  # never terminates: its own commits are covered by the verifier in the run
  # that made them. A push by any other role (the responder acting on human
  # feedback, the implementer) changes the pull request as a whole, so the
  # whole thing gets reviewed again. The role is read from the head commit's
  # Visionary-Role trailer, which every role writes.
  gate:
    name: gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          BOT: ${{ inputs.bot_login }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$ACTION" = synchronize ] && { [ "$ACTOR" = "$BOT" ] || [ "$ACTOR" = "github-actions[bot]" ]; }; then
            msg=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' || echo "")
            if grep -qi '^Visionary-Role: review' <<<"$msg"; then
              skip=true
              echo "head commit is the reviewer's own; the verifier in that run covers it"
            else
              echo "head commit is from another role; reviewing the pull request again"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pushed: ${{ steps.agent.outputs.pushed }}
      head_before: ${{ steps.agent.outputs.head_before }}
      head_after: ${{ steps.agent.outputs.head_after }}
      verdict: ${{ fromJSON(steps.agent.outputs.structured_output || '{}').verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Check out visionary
        uses: actions/checkout@v4
        with:
          repository: jamescalam/visionary
          ref: ${{ inputs.visionary_ref }}
          path: .visionary
      - name: Project setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - name: Ensure the fix label exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_LABEL: ${{ inputs.fix_label }}
        run: gh label create "$FIX_LABEL" --color e4e669 --description "Reviewer may push fixes to this PR" 2>/dev/null || true
      - name: Decide mode
        id: mode
        shell: bash
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BOT: ${{ inputs.bot_login }}
          FIX_LABEL: ${{ inputs.fix_label }}
        run: |
          if [ "$AUTHOR" = "$BOT" ] || [ "$LABELS" != "${LABELS/$FIX_LABEL/}" ]; then
            echo "mode=fix" >> "$GITHUB_OUTPUT"
          else
            echo "mode=comment" >> "$GITHUB_OUTPUT"
          fi
      - name: Review
        id: agent
        uses: ./.visionary/actions/run-agent
        with:
          skill: review
          args: ${{ github.repository }} ${{ github.event.pull_request.number }} ${{ steps.mode.outputs.mode }}
          oauth_token: ${{ secrets.claude_code_oauth_token }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          max_turns: ${{ inputs.max_turns }}
          pr_number: ${{ github.event.pull_request.number }}
          allowed_tools: ${{ steps.mode.outputs.mode == 'fix' && env.REVIEW_TOOLS_FIX || env.REVIEW_TOOLS_COMMENT }}
          disallowed_tools: ${{ steps.mode.outputs.mode == 'fix' && 'Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git reset:*)' || 'Edit,Write,Bash(git push:*),Bash(git commit:*)' }}
          json_schema: ${{ env.REVIEW_SCHEMA }}

  verify:
    name: verify
    needs: review
    if: needs.review.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      verdict: ${{ fromJSON(steps.agent.outputs.structured_output || '{}').verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Check out visionary
        uses: actions/checkout@v4
        with:
          repository: jamescalam/visionary
          ref: ${{ inputs.visionary_ref }}
          path: .visionary
      - name: Project setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - name: Verify
        id: agent
        uses: ./.visionary/actions/run-agent
        with:
          skill: verify
          args: ${{ github.repository }} ${{ github.event.pull_request.number }} ${{ needs.review.outputs.head_before }} ${{ needs.review.outputs.head_after }}
          oauth_token: ${{ secrets.claude_code_oauth_token }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.verifier_effort }}
          max_turns: ${{ inputs.max_turns }}
          allowed_tools: ${{ env.VERIFY_TOOLS }}
          disallowed_tools: "Edit,Write,Bash(git push:*),Bash(git commit:*)"
          json_schema: ${{ env.VERIFY_SCHEMA }}

  review-round-2:
    name: review round 2
    needs: [review, verify]
    if: needs.verify.outputs.verdict == 'changes_requested'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Check out visionary
        uses: actions/checkout@v4
        with:
          repository: jamescalam/visionary
          ref: ${{ inputs.visionary_ref }}
          path: .visionary
      - name: Project setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - name: Review again
        uses: ./.visionary/actions/run-agent
        with:
          skill: review
          args: ${{ github.repository }} ${{ github.event.pull_request.number }} fix
          oauth_token: ${{ secrets.claude_code_oauth_token }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          max_turns: ${{ inputs.max_turns }}
          pr_number: ${{ github.event.pull_request.number }}
          allowed_tools: ${{ env.REVIEW_TOOLS_FIX }}
          disallowed_tools: "Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git reset:*)"
          json_schema: ${{ env.REVIEW_SCHEMA }}
